[build]
  publish = "dist"
  command = "npm run build"

# Single-hop Canonical 301 Redirects: Bypass intermediate Netlify SSL/Domain-alias redirect chains
[[redirects]]
  from = "http://www.meonmode.com/*"
  to = "https://meonmode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.meonmode.com/*"
  to = "https://meonmode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://meonmode.com/*"
  to = "https://meonmode.com/:splat"
  status = 301
  force = true

# SPA Fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"
